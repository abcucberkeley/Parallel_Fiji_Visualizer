# Builds the native libraries from source and runs the whole test suite on
# every platform the plugin supports. This workflow only tests: release jars
# and update-site uploads come from the Jenkins pipeline.
name: Tests

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: Windows x64
            os: windows-2025
          - name: macOS arm64
            os: macos-15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Same compilers as the Jenkins agents, so the tests cover what ships:
      # on Windows the MinGW-w64 build the agent uses (GCC 12.2, UCRT, POSIX
      # threads, SEH), pinned by checksum; on macOS Homebrew GCC 13. Both
      # are GCC for OpenMP (Apple clang has none).
      - name: Install MinGW-w64 GCC 12.2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = 'https://github.com/niXman/mingw-builds-binaries/releases/download/12.2.0-rt_v10-rev2/x86_64-12.2.0-release-posix-seh-ucrt-rt_v10-rev2.7z'
          $archive = Join-Path $env:RUNNER_TEMP 'mingw.7z'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash
          if ($hash -ne 'dc1f299e8450c96f59f4b8f7c1290ebb78ee00ddb71f9ed4ca0efaf5462f8c4e') { throw "MinGW archive checksum mismatch: $hash" }
          7z x $archive "-o$env:RUNNER_TEMP" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Extracting MinGW failed" }
          "$env:RUNNER_TEMP\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CMAKE_GENERATOR=MinGW Makefiles" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Use Homebrew GCC 13 for the native build (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v gcc-13 > /dev/null || brew install gcc@13
          echo "CC=$(command -v gcc-13)" >> "$GITHUB_ENV"
          echo "CXX=$(command -v g++-13)" >> "$GITHUB_ENV"

      # The dependency builds (libtiff, zstd, c-blosc, ...) take most of the
      # time and only change with the CMake pins or the compiler, so they are
      # cached on exactly those. Our own JNI sources are always recompiled.
      - name: Record the compiler version
        shell: bash
        run: |
          mkdir -p target
          "${CC:-gcc}" --version | tee target/compiler-version

      - name: Cache the native dependency builds
        uses: actions/cache@v6
        with:
          path: target/native-build
          key: native-build-${{ matrix.os }}-${{ hashFiles('src/main/native/CMakeLists.txt', 'target/compiler-version') }}

      # -Pnative builds the natives for this platform and makes tests that
      # need them fail, rather than skip, if they cannot be loaded.
      - name: Build the natives and run the tests
        run: mvn -B -ntp package -Pnative
